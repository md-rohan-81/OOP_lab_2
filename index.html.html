<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cheat.Guard — A trusted environment for every Windows exam</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#050507;--mute:#a3a9bd;--red:#ff4d63;--green:#2ef2b0;--c:#e8ecff;--c2:#7b8cff;--hair:rgba(255,255,255,.08);color-scheme:dark}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;background:#000;color:#f5f6fa;font:400 26px/1.45 "Instrument Sans",system-ui,"Segoe UI",sans-serif;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;overflow:hidden;background:var(--bg);transform-origin:center}
.logo{font:800 44px Sora,sans-serif;letter-spacing:-.05em;color:#fff;white-space:nowrap}
.logo i{color:var(--red);font-style:normal}.logo em{color:#fff;font-style:normal}
#top{position:absolute;z-index:5;left:120px;right:120px;top:48px;display:flex;justify-content:space-between;align-items:center}
#tabs{display:flex;gap:10px}
#tabs button{font-size:21px;font-weight:500;color:var(--mute);padding:8px 22px;border-radius:99px;border:1px solid transparent;transition:.3s}
#tabs button.on{color:#05060a;background:linear-gradient(120deg,var(--c),var(--c2));font-weight:600}
#pg{position:absolute;z-index:5;left:120px;right:120px;bottom:40px;display:flex;gap:8px}
#pg button{flex:1;height:26px;position:relative}
#pg button::after{content:"";position:absolute;inset:11px 0 auto;height:4px;border-radius:4px;background:#23252f;transition:.4s}
#pg button.done::after{background:color-mix(in srgb,var(--c) 40%,#23252f)}
#pg button.on::after{background:linear-gradient(90deg,var(--c),var(--c2))}
/* slides */
.slide{position:absolute;inset:0;padding:160px 120px 110px;display:grid;grid-template-columns:660px 1fr;gap:90px;align-items:center;opacity:0;visibility:hidden;transition:transform .7s cubic-bezier(.2,.8,.2,1),opacity .5s,visibility 0s .7s;overflow:hidden}
.slide::before{content:"";position:absolute;width:1100px;height:1100px;right:-360px;top:-420px;background:radial-gradient(circle,color-mix(in srgb,var(--c) 22%,transparent),color-mix(in srgb,var(--c2) 8%,transparent) 45%,transparent 70%);pointer-events:none}
.slide.before{transform:translateX(-6%)}.slide.after{transform:translateX(6%)}
.slide.now{opacity:1;visibility:visible;transform:none;transition-delay:0s}
.slide.wide{display:flex;flex-direction:column;justify-content:center;align-items:stretch;gap:44px}
.slide.mid{display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.tx,.vs{position:relative;min-width:0}
.vs>*+*{margin-top:28px}
.kk{display:inline-flex;align-items:center;gap:12px;font:600 21px "Instrument Sans",system-ui,sans-serif;color:var(--c);padding:8px 20px 8px 16px;border-radius:99px;background:color-mix(in srgb,var(--c) 12%,transparent);border:1px solid color-mix(in srgb,var(--c) 30%,transparent);margin-bottom:28px}
.kk::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:0 0 14px var(--c);animation:pu 1.6s infinite}
@keyframes pu{50%{opacity:.35}}
h2{font:800 84px/1.03 "Bricolage Grotesque","Sora",sans-serif;letter-spacing:-.04em;background:linear-gradient(180deg,#fff 40%,#aab2cc);-webkit-background-clip:text;background-clip:text;color:transparent}
.wide h2{font-size:92px}
.sub{font-size:33px;line-height:1.35;color:var(--mute);margin-top:22px;max-width:19em}
.wide .sub{max-width:34em}
.tx .chips,.tx .flow{margin-top:36px}
.panel{background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.018));border:1px solid var(--hair);border-radius:26px}
.lbl{font:600 21px "Instrument Sans",system-ui,sans-serif;color:var(--mute);margin-bottom:14px}
/* flow */
.flow{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.flow.fill>.st{flex:1}
.st{padding:18px 26px;border-radius:18px;background:rgba(255,255,255,.05);border:1px solid var(--hair);font-weight:500;font-size:25px;line-height:1.25;transition:.45s}
.st.done{border-color:color-mix(in srgb,var(--c) 60%,transparent);color:#fff}
.st.on{background:linear-gradient(135deg,var(--c),var(--c2));color:#05060a;border-color:transparent;font-weight:600;box-shadow:0 0 50px color-mix(in srgb,var(--c) 45%,transparent);transform:scale(1.04)}
.st.stop{background:var(--red);color:#fff;border-color:transparent;box-shadow:0 0 50px rgba(255,77,99,.5);transform:scale(1.04)}
.ar{color:#5b6075;font-size:26px}
/* chips + cards */
.chips{display:flex;flex-wrap:wrap;gap:12px}
.chip{padding:9px 20px;border-radius:99px;font-size:22px;background:rgba(255,255,255,.045);border:1px solid var(--hair)}
.chip.r{border-color:rgba(255,77,99,.5);color:#ffb7c0;background:rgba(255,77,99,.08)}
.exp{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px}
.exp>div{padding:26px 28px;border-radius:24px;background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.015));border:1px solid var(--hair);position:relative;overflow:hidden}
.exp>div::before{content:"";position:absolute;inset:0 0 auto;height:3px;background:linear-gradient(90deg,var(--c),var(--c2))}
.exp b{display:block;font:800 29px "Bricolage Grotesque",sans-serif;letter-spacing:-.02em;margin-bottom:6px}
.exp span{color:var(--mute);font-size:23px;line-height:1.4;display:block}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:36px;align-items:start}
/* tree */
.pt,.pt ul{list-style:none;padding:0}
.pt li{position:relative;padding:7px 0 7px 28px}
.pt>li{padding-left:0}
.pt li li::before{content:"";position:absolute;left:0;top:0;bottom:0;border-left:2px solid #343847}
.pt li li::after{content:"";position:absolute;left:0;top:27px;width:22px;border-top:2px solid #343847}
.pt li li:last-child::before{bottom:auto;height:27px}
.pt ul{margin-left:22px;padding-top:6px}
.nd{display:inline-block;padding:6px 18px;border-radius:12px;font-weight:600;font-size:24px;background:rgba(255,255,255,.06);border:1px solid var(--hair);transition:.4s}
.nd.root{background:linear-gradient(135deg,var(--c),var(--c2));color:#05060a;font:800 25px "Bricolage Grotesque",sans-serif;border:0}
.nd.g{border-color:rgba(46,242,176,.6)}.nd.r{border-color:rgba(255,77,99,.6);color:#ffb7c0}
.nd.hl{background:color-mix(in srgb,var(--c) 28%,transparent);border-color:var(--c);box-shadow:0 0 30px color-mix(in srgb,var(--c) 35%,transparent)}
.pt small{color:var(--mute);font-size:21px;margin-left:12px}
/* feed */
.feed{padding:18px;display:flex;flex-direction:column;gap:10px;overflow:hidden;height:var(--h,420px)}
.ln{display:flex;align-items:center;gap:16px;padding:13px 18px;border-radius:16px;background:rgba(255,255,255,.04);border:1px solid var(--hair);font-size:24px;animation:in .55s cubic-bezier(.2,.8,.2,1)}
@keyframes in{from{opacity:0;transform:translateY(-18px)}}
.ln b{font:600 17px "Instrument Sans",system-ui,sans-serif;padding:4px 13px;border-radius:99px;min-width:92px;text-align:center}
.ln.ok b{background:rgba(46,242,176,.15);color:var(--green)}.ln.bad b{background:rgba(255,77,99,.17);color:var(--red)}
.ln.bad{border-color:rgba(255,77,99,.35);background:rgba(255,77,99,.07)}
.ln span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ln em{font-style:normal;color:var(--mute);font-size:19px}
.mono .ln{font:400 21px "JetBrains Mono",monospace}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:24px}
/* room table + board */
.tbl{padding:10px 26px}
.tr{display:grid;grid-template-columns:1.25fr .8fr 1fr 1.2fr 1fr;align-items:center;height:62px;border-top:1px solid var(--hair);font-size:23px;transition:background .4s;margin:0 -26px;padding:0 26px}
.tr:first-child{border:0;color:var(--mute);font-size:19px;height:54px}
.tr.hot{background:rgba(255,77,99,.12)}
.ok{color:var(--green)}.bad{color:var(--red)}
.board{padding:22px}
.board h3{display:flex;justify-content:space-between;font:600 21px "Instrument Sans",system-ui,sans-serif;color:var(--mute);margin-bottom:18px}
.board h3 em{font-style:normal;color:var(--green)}
.rows{position:relative;height:420px}
.row{position:absolute;left:0;right:0;height:62px;border-radius:16px;border:1px solid var(--hair);background:rgba(255,255,255,.04);display:flex;align-items:center;gap:16px;padding:0 22px;transition:transform .8s cubic-bezier(.2,.8,.2,1),background .5s,border-color .5s}
.row .dot{width:12px;height:12px;border-radius:50%;background:var(--green)}
.row .n{flex:1;font-weight:500;line-height:1.15}.row small{display:block;color:var(--mute);font-size:17px}
.row .cn{font:800 30px "Bricolage Grotesque",sans-serif}
.row.warn{background:rgba(255,77,99,.16);border-color:rgba(255,77,99,.5)}.row.warn .dot{background:var(--red)}
.row.hot{background:linear-gradient(90deg,#ff4d63,#e0243f);border-color:#ff4d63;color:#fff;box-shadow:0 0 40px rgba(255,77,99,.4)}.row.hot .dot{background:#fff}.row.hot small{color:#ffd9de}
/* misc live */
.scn{font-size:28px;padding:14px 26px}
.scn b{font-weight:600}
.chk{list-style:none;padding:22px 28px}
.chk li{display:flex;align-items:center;gap:18px;padding:9px 0;font-size:25px;color:#6d7288;transition:.4s}
.chk li::before{content:"";width:30px;height:30px;border-radius:50%;border:2px solid #3a3e4d;flex:none;transition:.4s;text-align:center;font-size:19px;line-height:26px;color:#05060a}
.chk li.done{color:#fff}.chk li.done::before{content:"✓";background:linear-gradient(135deg,var(--c),var(--c2));border-color:transparent;font-weight:800}
.cph{display:grid;grid-template-columns:1fr auto 1fr;gap:22px;align-items:center;padding:26px 30px}
.cph .bx{font:400 21px "JetBrains Mono",monospace;padding:20px 22px;border-radius:16px;background:rgba(0,0,0,.4);border:1px solid var(--hair);word-break:break-all;line-height:1.35}
.cph .bx small{display:block;font:500 17px "Instrument Sans",system-ui,sans-serif;color:var(--mute);margin-bottom:6px}
.lock{font-size:40px;text-align:center}
.tm{grid-column:1/-1;font-size:24px;font-weight:600;text-align:center}
.note{margin-top:36px;padding:22px 28px;border-radius:20px;background:rgba(255,77,99,.09);border:1px solid rgba(255,77,99,.4);font-size:27px;line-height:1.35;color:#ffd0d6}
/* cover/final */
.mid .logo{font-size:230px;line-height:1;position:relative;letter-spacing:-.055em}
.mid .sub{margin:26px auto 0;max-width:none;font-size:38px}
.pills{display:flex;gap:20px;margin-top:60px;justify-content:center}
.pills div{padding:16px 32px;border-radius:99px;font-size:26px;background:rgba(255,255,255,.05);border:1px solid var(--hair)}
.pills b{font:800 30px "Bricolage Grotesque";margin-left:10px}
.hint{margin-top:46px;color:#6d7288;font-size:22px}
.big{font:800 58px/1.12 "Bricolage Grotesque","Sora",sans-serif;letter-spacing:-.035em;margin-top:44px;max-width:20em}

h2,.exp b,.nd.root,.row .cn,.pills b,.big,.odo b{font-family:Sora,"Segoe UI",sans-serif}
h2{font-size:68px;font-weight:700;line-height:1.14;letter-spacing:-.03em;background:none;color:#fff;-webkit-text-fill-color:#fff;text-wrap:balance;padding-bottom:.04em}
.wide h2{font-size:78px}
.sub{font-size:31px;line-height:1.45;font-weight:400;text-wrap:pretty}
.kk{font-size:20px;letter-spacing:.01em}
.exp b{font-size:26px;font-weight:700;letter-spacing:-.02em}
.exp span{font-size:22px;line-height:1.5}
.big{font-weight:700;font-size:56px;line-height:1.18;letter-spacing:-.03em;text-wrap:balance}
.nd.root{font-size:23px;font-weight:700}
.tx .exp{margin-top:36px}
.orbit{position:relative;width:900px;height:560px}
.pcc{position:absolute;left:300px;top:195px;width:300px;height:170px;display:flex;flex-direction:column;align-items:center;justify-content:center;font:700 28px Sora,sans-serif;transition:.5s}
.pcc small{font:500 22px "Instrument Sans",system-ui,sans-serif;color:var(--mute);margin-top:6px}
.tb{position:absolute;padding:12px 24px;border-radius:99px;font-size:25px;font-weight:600;background:rgba(255,77,99,.16);border:1px solid var(--red);color:#ffc2c9;opacity:0;transform:scale(.4)}
.tb.pop{animation:pop .6s cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes pop{to{opacity:1;transform:none}}
.trk{display:flex;flex-direction:column;align-items:flex-start}
.trk .st{min-width:360px;font-size:27px}
.tl{width:2px;height:60px;margin-left:56px;background:#343847;position:relative}
.tl i{position:absolute;left:-5px;width:12px;height:12px;border-radius:50%;background:var(--c);box-shadow:0 0 20px var(--c);animation:runv 1.8s linear infinite}
@keyframes runv{from{top:-6px}to{top:54px}}
.odo{padding:12px 30px}
.odo div{display:flex;justify-content:space-between;align-items:baseline;padding:11px 0;border-top:1px solid var(--hair);font-size:24px;color:var(--mute)}
.odo div:first-child{border:0}
.odo b{font-size:34px;color:#fff;font-variant-numeric:tabular-nums}
.fork{display:flex;flex-direction:column;align-items:flex-start}
.fork .rq{margin-left:calc(36.5% - 130px)}
.fork .stem{width:2px;height:24px;background:#343847;margin-left:36.5%}
.fork .bar{width:57.6%;height:24px;margin-left:8%;border:2px solid #343847;border-bottom:0;border-radius:20px 20px 0 0}
.fork .two{display:grid;grid-template-columns:1fr 1fr;gap:40px;width:100%}
.fork .nd{font-size:21px;padding:5px 14px}
.fork .nd.root{font-size:22px}
.fork .pt small{font-size:18px;margin-left:8px}
.nd.stp{background:var(--red);border-color:var(--red);color:#fff;box-shadow:0 0 36px rgba(255,77,99,.5)}
.nd.okk{background:rgba(46,242,176,.2);border-color:var(--green);color:#fff}
.lanes{padding:18px 26px;position:relative}
.lanes::after{content:"";position:absolute;left:58%;top:12px;bottom:12px;border-left:3px dashed #4a4f63}
.lane{height:62px;position:relative}
.fl{position:absolute;top:8px;padding:8px 18px;border-radius:12px;font-size:21px;background:rgba(46,242,176,.14);border:1px solid var(--green);white-space:nowrap;opacity:0;animation:pass 8s infinite;animation-delay:var(--d)}
.fl.no{background:rgba(255,77,99,.14);border-color:var(--red);animation-name:block}
@keyframes pass{0%{left:0;opacity:0}8%{opacity:1}70%{left:62%;opacity:1}88%,100%{left:64%;opacity:0}}
@keyframes block{0%{left:0;opacity:0}8%{opacity:1}34%{left:26%;opacity:1}40%{transform:translateX(-8px)}44%{transform:translateX(8px)}48%{transform:translateX(-6px)}52%,62%{left:26%;transform:none;opacity:1;background:#ff4d63;color:#fff}78%,100%{left:20%;opacity:0}}
.paper{padding:22px 28px;height:470px;overflow:hidden;font:400 22px/1.5 "JetBrains Mono",monospace}
.tw{display:flex;gap:16px;align-items:center;padding:9px 0;border-bottom:1px dashed #2a2d39}
.tw em{font-style:normal;color:var(--mute)}
.tw span{display:inline-block;overflow:hidden;white-space:nowrap;width:0;color:#ffb7c0;border-right:2px solid var(--c);animation:typ 1.4s steps(var(--s),end) forwards}
.tw i{font:500 18px "Instrument Sans",system-ui,sans-serif;font-style:normal;color:var(--green);opacity:0;margin-left:auto;animation:fi .3s 1.45s forwards}
@keyframes typ{to{width:var(--w);border-color:transparent}}
@keyframes fi{to{opacity:1}}
.pbs{padding:24px 30px;display:grid;gap:20px}
.pbs>div{display:grid;grid-template-columns:320px 1fr 100px;gap:20px;align-items:center;font-size:23px}
.pb{display:block;height:10px;border-radius:6px;background:#23252f;overflow:hidden}
.pb i{display:block;height:100%;width:0;border-radius:6px;background:linear-gradient(90deg,var(--c),var(--c2));animation:fill 8s ease-out infinite;animation-delay:var(--d)}
.pbs em{font-style:normal;color:var(--green);font-weight:600;opacity:0;animation:ok 8s infinite;animation-delay:var(--d)}
@keyframes fill{0%{width:0}30%,88%{width:100%}100%{width:0}}
@keyframes ok{0%,28%{opacity:0}34%,88%{opacity:1}100%{opacity:0}}
.grow li{animation:grow 12s infinite both}
@keyframes grow{0%{opacity:0;transform:translateX(-18px)}6%,86%{opacity:1;transform:none}100%{opacity:0}}

.mid .logo{font-size:150px}
.team{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;width:1560px;margin-top:52px;text-align:left}
.tc{padding:28px 34px;border-radius:24px;background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.015));border:1px solid var(--hair);position:relative;overflow:hidden}
.tc::before{content:"";position:absolute;inset:0 0 auto;height:3px;background:linear-gradient(90deg,var(--c),var(--c2))}
.tc small{display:block;color:var(--c);font-weight:600;font-size:21px;margin-bottom:10px}
.tc b{display:block;font:700 40px Sora,sans-serif;letter-spacing:-.02em;line-height:1.2}
.tc span{color:var(--mute);font-size:26px}
.info{display:grid;grid-template-columns:1.25fr .55fr 1.5fr .5fr;gap:20px;width:1560px;margin-top:24px;text-align:left}
.info>div{padding:20px 26px;border-radius:20px;border:1px solid var(--hair);background:rgba(255,255,255,.03);font-size:22px;line-height:1.4}
.info small{display:block;color:var(--mute);font-size:18px;margin-bottom:6px}
.note{font-size:24px;padding:18px 24px;margin-top:28px;line-height:1.4}
.note b{display:block;color:#fff;font-size:20px;margin-bottom:4px}
.end2{display:flex;gap:80px;margin-top:52px;text-align:left;justify-content:center}
.mid .sub{font-size:36px;line-height:1.35;margin:28px auto 0;max-width:none;color:var(--mute)}
.team{margin-top:64px;gap:24px;align-items:stretch}
.tc{padding:30px 36px;display:flex;flex-direction:column;justify-content:center;min-height:180px}
.tc small{color:var(--mute);font:500 22px "Instrument Sans",system-ui,sans-serif;margin-bottom:12px}
.tc b{font-size:44px;line-height:1.15;margin-bottom:8px}
.tc span{font:500 28px "Instrument Sans",system-ui,sans-serif;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.info{margin-top:24px;grid-template-columns:1.35fr .6fr 1.65fr .6fr;align-items:stretch}
.info>div{padding:24px 30px;font-size:25px;line-height:1.4;font-weight:500}
.info small{font:600 19px "Instrument Sans",system-ui,sans-serif;color:var(--mute);margin-bottom:10px}
.big{font-size:60px;line-height:1.15;max-width:18em;margin:48px auto 0}
.end2{gap:100px;margin-top:64px}
.end2 .lbl{font-size:20px;margin-bottom:16px}
.end2 .chips{max-width:640px}
.end2 .chip{font-size:24px;padding:10px 22px}
.mid{gap:0}
.nd.root.hl{background:color-mix(in srgb,var(--c) 30%,#14151c);color:#fff;border:1px solid var(--c)}
.nd.root.okk{color:#fff}
/* last slide: balanced size + centered layout */
.mid .big{font-size:68px;line-height:1.16;max-width:20em;margin:44px auto 0}
.end2{width:1500px;max-width:100%;display:grid;grid-template-columns:1fr 1fr;gap:0;margin-top:64px;text-align:center;justify-content:normal}
.end2>div{padding:0 50px}
.end2>div+div{border-left:1px solid var(--hair)}
.end2 .lbl{font-size:24px;margin-bottom:20px;letter-spacing:.02em}
.end2 .chips{max-width:none;justify-content:center;gap:14px}
.end2 .chip{font-size:27px;padding:12px 26px}
.info>div.inf-b{display:flex;flex-direction:column;justify-content:center;font:700 40px/1.1 Sora,"Segoe UI",sans-serif;letter-spacing:.01em;color:#fff}
.info>div.inf-b small{font:600 19px "Instrument Sans",system-ui,sans-serif;letter-spacing:0;margin-bottom:12px}
/* ---- closing slide: 3 beats (ship -> coming next -> questions) ---- */
.zstage{position:relative;width:1680px;height:760px}
.zl{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;opacity:0;visibility:hidden;transform:translateY(46px);transition:opacity .8s,transform .9s cubic-bezier(.2,.8,.2,1),visibility 0s .9s}
.slide[data-ph=a] .zone,.slide[data-ph=b] .ztwo,.slide[data-ph=c] .zthree{opacity:1;visibility:visible;transform:none;transition-delay:.35s,.35s,0s}
.slide[data-ph=b] .zone,.slide[data-ph=c] .zone,.slide[data-ph=c] .ztwo{transform:translateY(-46px)}
.zone .big{font:700 66px/1.16 Sora,"Segoe UI",sans-serif;letter-spacing:-.03em;max-width:19em;margin:40px auto 0;color:#fff;text-wrap:balance}
.zone .big em{font-style:normal;background:linear-gradient(100deg,#35e0ff,#b197ff 55%,#ff6bd6);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.zship{margin-top:60px}
.zship .lbl{font:600 21px/1 "Instrument Sans",system-ui,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);margin-bottom:24px}
.zship .chips{justify-content:center;flex-wrap:nowrap;gap:14px}
.zship .chip{font-size:26px;padding:12px 26px;white-space:nowrap;font-weight:500}
.zship .chip::before{content:"✓";color:var(--green);font-weight:700;margin-right:12px}
.ztwo h2{font:700 84px/1.08 Sora,"Segoe UI",sans-serif;letter-spacing:-.035em;text-wrap:balance}
.zcards{display:grid;grid-template-columns:repeat(3,1fr);gap:36px;width:1680px;margin-top:76px;text-align:left}
.zcard{position:relative;overflow:hidden;padding:40px 36px 46px;border-radius:28px;background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.016));border:1px solid var(--hair);opacity:0;transform:translateY(70px) scale(.96);transition:opacity .7s,transform .9s cubic-bezier(.2,1.1,.3,1)}
.zcard::before{content:"";position:absolute;inset:0 0 auto;height:4px;background:linear-gradient(90deg,var(--c),var(--c2))}
.zcard::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 100% 0,color-mix(in srgb,var(--c) 22%,transparent),transparent 60%)}
.zcard>*{position:relative;z-index:1}
.zcard i{display:block;font:500 24px "JetBrains Mono",monospace;font-style:normal;letter-spacing:.08em;color:var(--c);margin-bottom:34px}
.zcard b{display:block;white-space:nowrap;font:700 40px/1.1 Sora,"Segoe UI",sans-serif;letter-spacing:-.025em;margin-bottom:16px;color:#fff}
.zcard span{display:block;min-height:2.9em;font:400 27px/1.45 "Instrument Sans",system-ui,sans-serif;color:var(--mute)}
.slide[data-ph=b] .zcard{opacity:1;transform:none;transition-delay:calc(.8s + var(--i)*.7s)}
.zthree .kk{font-size:22px;margin-bottom:34px}
.zq{font:800 168px/1.05 Sora,"Segoe UI",sans-serif;letter-spacing:-.045em;padding-bottom:.14em;background:linear-gradient(100deg,#fff 0%,#35e0ff 32%,#b197ff 66%,#ff6bd6 100%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;animation:zsh 7s ease-in-out infinite alternate}
@keyframes zsh{to{background-position:100% 0}}
.zteam{display:flex;gap:56px;margin-top:40px;font:500 27px/1 "Instrument Sans",system-ui,sans-serif;color:var(--mute)}
.zteam span{display:flex;align-items:center;gap:14px}
.zteam i{width:12px;height:12px;border-radius:50%}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="stage">
<div id="top"><button class="logo" id="home" aria-label="Start"><em>Cheat</em><i>.</i>Guard</button><div id="tabs"></div></div>
<div id="pg"></div>
</div>
<script>
const $=(e,s)=>e.querySelector(s),$$=(e,s)=>[...e.querySelectorAll(s)];
const T=t=>typeof t==='string'?{t}:t;
const A='<span class="ar">›</span>',LOGO='<div class="logo"><em>Cheat</em><i>.</i>Guard</div>';
const flow=(s,o='')=>`<div class="flow ${o}"${o.includes('skip')?' data-skip="1"':''}>`+s.map((x,i)=>(i?A:'')+`<div class="st">${x}</div>`).join('')+'</div>';
const chips=(l,k='')=>'<div class="chips">'+l.map(x=>`<span class="chip ${k}">${x}</span>`).join('')+'</div>';
const exp=l=>'<div class="exp">'+l.map(([t,m])=>`<div><b>${t}</b><span>${m}</span></div>`).join('')+'</div>';
const li=n=>{const[t,d,k,ch]=n;return `<li><span class="nd ${k||''}">${t}</span>${d?`<small>${d}</small>`:''}${ch?`<ul>${ch.map(li).join('')}</ul>`:''}</li>`};
const tree=(r,kids,hl)=>`<ul class="pt"${hl?' data-hl="1"':''}><li><span class="nd root">${r}</span><ul>${kids.map(li).join('')}</ul></li></ul>`;
const feed=(id,n,h,cls='')=>`<div class="panel feed ${cls}" data-f="${id}" data-n="${n}" style="--h:${h}px"></div>`;
const chk=l=>'<ul class="chk panel">'+l.map(x=>`<li>${x}</li>`).join('')+'</ul>';
const lbl=t=>`<p class="lbl">${t}</p>`;
const pad=n=>String(n).padStart(2,'0');
function push(el,id,k,items,time){
 const b=$(el,`[data-f=${id}]`);if(!b)return;if(k===0)b.innerHTML='';
 const[a,t,x]=items[k%items.length],d=document.createElement('div');d.className='ln '+a;
 d.innerHTML=`<b>${t}</b><span>${x}</span>${time?`<em>${time}</em>`:''}`;b.prepend(d);
 while(b.children.length>+b.dataset.n)b.lastChild.remove();
}
const PART=[{n:'Monitor',who:'Faiyaz Rafa',c:'#35e0ff',c2:'#5b8cff'},{n:'Protection',who:'Md. Rohan',c:'#b197ff',c2:'#ff6bd6'},{n:'Evidence',who:'Md. Muhid Khan',c:'#2ef2b0',c2:'#c3f55a'}];
/* ---- live behaviours ---- */
const NAMES=['Student 1042','Student 1055','Student 1063','Student 1071','Student 1088','Student 1094'];
const EV=['Blocked website','Unknown app','USB device','VPN attempt','Outside folder'];
let bs=[];
function board(el,k){
 const rows=$$(el,'.row');
 if(k===0)bs=[0,1,0,0,2,0].map((c,i)=>({c,m:c?EV[i%5]:''}));
 else if(k%2===0){const s=bs[(k*7+3)%6];s.c++;s.m=EV[k%5];if(s.c>5)bs.forEach(x=>x.c=Math.max(0,x.c-3))}
 bs.map((s,i)=>i).sort((a,b)=>bs[b].c-bs[a].c||a-b).forEach((id,pos)=>{
  const r=rows[id],s=bs[id];r.style.transform=`translateY(${pos*70}px)`;
  r.className='row'+(s.c>=3?' hot':s.c?' warn':'');
  $(r,'.cn').textContent=s.c;$(r,'small').textContent=s.c?s.m:'No alerts';});
}
function room(el,k){$$(el,'.tr:not(:first-child)').forEach((r,i)=>{const a=(k+i*4)%14>10;
 $(r,'.ls').textContent=((k+i)%5+1)+' sec ago';const s=$(r,'.sts');s.textContent=a?'● Alert':'● Connected';s.className='sts '+(a?'bad':'ok');r.classList.toggle('hot',a)})}
function pair(el,k){const st=$$(el,'.flow .st'),bad=Math.floor(k/6)%2,i=k%6;
 st[2].textContent=bad?'Wrong exam code':'Exam code';st[3].textContent=bad?'Rejected':'Student connected';
 st.forEach((s,j)=>{s.className='st'+(j<i?' done':j===i?' on':'')+(bad&&j>=2&&j<=i?' stop':'')})}
const SC=[['exam.college.edu',3,0,'Allowed'],['game-site.com',1,1,'Blocked by DNS filter'],['VPN app',2,1,'Blocked by firewall']];
function net(el,k){net2(el,k)}
function net2(el,k){const sc=SC[Math.floor(k/6)%3],p=k%6,stop=sc[1],bad=sc[2],r=Math.min(p,stop);
 const n=[$(el,'.rq'),...$$(el,'.two .nd.root')];
 n.forEach((x,j)=>{x.classList.remove('hl','stp','okk');if(j<r)x.classList.add('okk');else if(j===r&&r<=2)x.classList.add(p>=stop&&bad?'stp':'hl')});
 n[0].textContent='Opens '+sc[0];
 $(el,'.scn').innerHTML=`Result: <b class="${p>=stop?(bad?'bad':'ok'):''}">${p>=stop?sc[3]:'checking…'}</b>`}
function enc(el,k){let s='';for(let i=0;i<44;i++)s+='0123456789abcdef'[Math.random()*16|0];$(el,'.ct').textContent=s;
 const bad=Math.floor(k/6)%2,t=$(el,'.tm');t.textContent=bad?'✕ Edit detected — record flagged':'✓ Seal intact — nothing was changed';t.className='tm '+(bad?'bad':'ok')}
const F={
 prob:[['bad','App','Unknown app opened'],['bad','Website','Blocked website tried'],['bad','USB','USB drive plugged in'],['bad','VPN','VPN started'],['bad','Folder','Unknown folder opened'],['bad','User','Second user switched in']],
 dog:[['ok','Apps','chrome.exe is allowed'],['bad','Apps','game.exe blocked'],['ok','Sites','exam.college.edu allowed'],['bad','Devices','USB drive detected'],['bad','Network','VPN adapter blocked'],['ok','Files','exam-folder is safe']],
 app:[['ok','Allowed','exam-app.exe'],['bad','Blocked','game.exe'],['ok','Allowed','notepad.exe'],['bad','Blocked','chat-app.exe'],['bad','Blocked','remote-tool.exe']],
 web:[['ok','Allowed','exam.college.edu'],['bad','Blocked','game-site.com'],['ok','Allowed','docs.college.edu'],['bad','Blocked','answers-hub.com'],['bad','Blocked','vpn-free.net']],
 file:[['ok','Allowed','Exam/answer.docx'],['bad','Blocked','Desktop/notes.txt'],['ok','Allowed','Videos/recording.mp4'],['bad','Blocked','Downloads/cheat.pdf'],['bad','Alert','USB drive E:']],
 log:[['bad','Website','game-site.com blocked'],['bad','App','game.exe stopped'],['bad','USB','Drive E: plugged in'],['bad','Network','VPN adapter added'],['bad','Folder','Desktop opened'],['bad','User','Switch attempt']]
};
const lg=k=>{const s=720+k*3;return `${pad(12+Math.floor(s/3600))}:${pad(Math.floor(s/60)%60)}:${pad(s%60)}`};
/* ---- slides ---- */
const S=[
{mid:1,html:()=>`${LOGO.replace('class="logo"','class="logo" style="font-size:120px"')}<p class="sub">A trusted environment for every Windows exam.</p><div class="team">`+[['Faiyaz Rafa','25524204132',0,'Central monitor'],['Md. Rohan','25524204078',1,'Student protection'],['Md. Muhid Khan','25524204092',2,'Evidence and recovery']].map(([n,id,i,r])=>`<div class="tc"><small>Student</small><b>${n}</b><span>${id}</span></div>`).join('')+'</div><div class="info">'+[['Course','CSE–2208<br>Object Oriented Programming Laboratory-2'],['Department','CSE'],['Faculty supervisors','1. Lecturer Md Musfiqur Rahman Mridha<br>2. Lecturer Anika Ashraf'],['Institution','BUP']].map(([a,b],i)=>`<div class="${i%2?'inf-b':''}"><small>${a}</small>${b}</div>`).join('')+'</div>'},
{p:0,k:'The problem',h:'The exam has started.',sub:'But can we really control the computer?',v:()=>'<div class="orbit"><div class="panel pcc">Exam computer<small></small></div>'+[['Unknown app',20,40],['Blocked website',600,30],['USB device',0,430],['VPN started',660,410],['Unknown folder',300,0],['Second user',330,490]].map(([t,l,tp])=>`<span class="tb" style="left:${l}px;top:${tp}px">${t}</span>`).join('')+'</div>',live:(el,k)=>{const n=k%9,p=$(el,'.pcc');$$(el,'.tb').forEach((b,i)=>b.classList.toggle('pop',i<n));p.style.borderColor=n?'#ff4d63':'';p.style.boxShadow=n?`0 0 ${n*8}px rgba(255,77,99,.45)`:'';$(p,'small').textContent=n?n+' risks found':'Looks calm'}},
{p:0,w:1,k:'The idea',h:'Meet Cheat.Guard.',sub:'It watches the exam computer, so people do not have to.',v:()=>`<div class="duo"><div class="trk"><div class="st">Student computers</div><div class="tl"><i></i></div><div class="st">Cheat.Guard</div><div class="tl"><i style="animation-delay:.9s"></i></div><div class="st">Invigilator control room</div></div>${tree('Cheat.Guard',[['Central monitor','sees every student'],['Student protection','guards every exam PC'],['Evidence and recovery','keeps proof safe']],1)}</div>`},
{p:0,h:'One control room.',sub:'No need to walk to every computer.',x:()=>chips(['Student ID','PC name','Course','Status','Last seen','Detailed view']),
 v:()=>'<div class="panel tbl"><div class="tr"><span>Student</span><span>PC</span><span>Course</span><span>Status</span><span>Last seen</span></div>'+NAMES.map((n,i)=>`<div class="tr"><span>${n}</span><span>PC-0${i+1}</span><span>CSE 101</span><span class="sts"></span><span class="ls"></span></div>`).join('')+'</div>',live:room},
{p:1,h:'Smart alerts. Safe pairing.',sub:'The right student rises to the top. Only the right PC can join.',x:()=>flow(['Monitor address (LAN IP)','Secure certificate (TLS)','Exam code','Student connected'],'skip')+'<div class="note"><b>Honest limits</b>Network failure can delay alerts. Alerts are signals for review, not proof of cheating.</div>',
 v:()=>'<div class="panel board"><h3>Live monitor <em>● Live</em></h3><div class="rows">'+NAMES.map(n=>`<div class="row"><span class="dot"></span><span class="n">${n}<small></small></span><span class="cn"></span></div>`).join('')+'</div></div>'+chips(['TLS secure connection','Certificate checked','Exam code checked','Events wait if the network drops']),live:(el,k)=>{board(el,k);pair(el,k)}},
{p:1,h:'A guardian inside every PC.',sub:'The monitor shows the risk. The watchdog controls it.',v:()=>tree('Student watchdog',[['App watch','Which apps run?'],['Website watch','Which sites open?'],['File watch','Which folders open?'],['Device watch','Any USB or phone?'],['Network watch','Any VPN or bypass?']],1)+feed('a',4,300),live:(el,k)=>push(el,'a',k,F.dog)},
{p:1,h:'Two locks on the network.',sub:'DNS checks the website name. The firewall checks the road.',x:()=>exp([['DNS filter','A phone book for websites.'],['Firewall','A gate guard for the network.']]),v:()=>`<div class="fork"><span class="nd root rq">Student opens a website</span><div class="stem"></div><div class="bar"></div><div class="two"><div>${tree('DNS filter',[['Checks the website name'],['Approved website','allowed','g'],['Other websites','blocked, logged','r'],['Alert sent to monitor']])}</div><div>${tree('Firewall protection',[['Secret DNS (DoH)','blocked'],['Proxy and PAC','blocked'],['VPN and tunnels','blocked'],['Remote desktop','blocked'],['QUIC and IPsec','blocked'],['IPv4 and IPv6','both safe','g']])}</div></div></div><div class="panel scn"></div>`,live:net},
{p:1,h:'A safe exam workspace.',sub:'Exam files inside. Everything else watched.',x:()=>chips(['Windows file permissions','Folder watch','USB and phones','Clipboard cleanup','No user switching'])+'<div class="note"><b>Honest limits</b>Some hidden tunnels are hard to detect. A wrong setting can block a good website.</div>',
 v:()=>`<div class="duo">${tree('Exam workspace',[['Exam files','','g'],['App data','','g'],['Videos folder','record','g']])}${tree('Outside',[['Restricted','','r'],['Monitored','','r'],['Logged','','r']])}</div>`+'<div class="panel lanes">'+[['Exam/answer.docx','',-6],['Desktop/notes.txt','no',-4],['Videos/recording.mp4','',-2],['Downloads/cheat.pdf','no',0]].map(([t,c,d])=>`<div class="lane"><span class="fl ${c}" style="--d:${d}s">${t}</span></div>`).join('')+'</div>'},
{p:2,h:'Every event becomes evidence.',sub:'Nothing suspicious is lost.',x:()=>flow(['Event','Local log','Central alert','Protected record'],'skip'),v:()=>lbl('Session record, written live')+'<div class="panel paper"></div>'+chips(['Event type','Time','Student session','App, site, folder or device']),live:(el,k)=>{const b=$(el,'.paper');if(k===0)b.innerHTML='';if(k%2)return;const[,t,x]=F.log[(k/2)%F.log.length],q=t+' · '+x,d=document.createElement('div');d.className='tw';d.innerHTML=`<em>${lg(k)}</em><span style="--w:${q.length}ch;--s:${q.length}">${q}</span><i>🔒 saved</i>`;b.appendChild(d);while(b.children.length>7)b.firstChild.remove()}},
{p:2,w:1,h:'The log is protected.',sub:'Saved is not enough. It must be safe.',v:()=>flow(['Session log','AES-256-GCM lock','Signature seal','Windows access lock','Encrypted backup'],'fill skip')+'<div class="panel cph"><div class="bx"><small>What happened</small>12:04  Blocked website  game-site.com</div><div class="lock">🔒</div><div class="bx"><small>What is stored</small><span class="ct"></span></div><div class="tm"></div></div>'+exp([['AES-256-GCM','A very strong lock that also shows any change.'],['Tamper check','Edited logs are caught.'],['Safe backup','All-or-nothing copy. Plain copies refused.'],['Retention','Old backups cleaned by count and age.']]),live:enc},
{p:2,h:'Nothing is left broken.',sub:'Protect the exam. Never damage the computer.',x:()=>'<div class="note"><b>Honest limits</b>A local administrator can override it. It cannot stop screen photos or a second phone. People still supervise the exam.</div>',v:()=>`<div class="cols2"><div>${lbl('When the exam ends')}${chk(['Stop watchdog','Restore network','Restore file permissions','Restore user switching','Restore clipboard','Seal activity log','Encrypted backup'])}</div><div>${lbl('If something goes wrong')}${tree('Recovery',[['Crash or power cut','old session found'],['Emergency restore','fixes network and files'],['Fail-safe task','runs on next start'],['Diagnostics','shows what happened']])}</div></div>`},
{mid:1,html:()=>`<div class="zstage">
<div class="zl ztwo"><div class="kk">Coming up next</div><h2>Three upgrades on the way.</h2><div class="zcards">`+[['01','More alert types','Catch more kinds of suspicious activity.','#35e0ff','#5b8cff'],['02','Better reports','Clear summaries after every exam.','#b197ff','#ff6bd6'],['03','Wider device checks','Look at more devices around the exam PC.','#2ef2b0','#c3f55a']].map(([n,t,d,c,c2],i)=>`<div class="zcard" style="--i:${i};--c:${c};--c2:${c2}"><i>${n}</i><b>${t}</b><span>${d}</span></div>`).join('')+`</div></div>
<div class="zl zthree"><div class="kk">Thank you</div><div class="zq">Any questions?</div><div class="zteam">`+PART.map(p=>`<span><i style="background:${p.c};box-shadow:0 0 14px ${p.c}"></i>${p.who}</span>`).join('')+`</div></div>
</div>`,live:(el,k)=>{const p=k<9?'b':'c';if(el.dataset.ph!==p)el.dataset.ph=p}}
];
/* ---- build ---- */
const stage=document.getElementById('stage'),N=S.length;
const NEU={c:'#e8ecff',c2:'#7b8cff'};
S.forEach((s,i)=>{
 const P=s.p!=null?PART[s.p]:NEU,e=document.createElement('section');
 e.className='slide'+(s.w?' wide':'')+(s.mid?' mid':'');e.style.setProperty('--c',P.c);e.style.setProperty('--c2',P.c2);
 e.innerHTML=s.mid?s.html():`<div class="tx"><div class="kk">${PART[s.p].who} · ${s.k||PART[s.p].n}</div><h2>${s.h}</h2><p class="sub">${s.sub}</p>${s.x?s.x():''}</div><div class="vs">${s.v()}</div>`;
 stage.insertBefore(e,document.getElementById('top'));
});
$$(stage,'.grow li').forEach((l,i)=>l.style.animationDelay=(i*.45)+'s');
const sl=$$(stage,'.slide'),tabs=$(stage,'#tabs'),pg=$(stage,'#pg');
PART.forEach((p,i)=>{const b=document.createElement('button');b.textContent=p.n;b.onclick=()=>go(S.findIndex(s=>s.p===i));tabs.appendChild(b)});
S.forEach((s,i)=>{const b=document.createElement('button');b.setAttribute('aria-label','Slide '+(i+1));b.onclick=()=>go(i);pg.appendChild(b)});
let cur=-1,tk=0,t0=0;
function run(){
 const el=sl[cur],k=tk-t0;
 $$(el,'.flow:not([data-skip])').forEach(f=>{const st=$$(f,'.st'),i=k%(st.length+2);st.forEach((s,j)=>s.className='st'+(j<i?' done':j===i?' on':''))});
 $$(el,'.chk').forEach(u=>{const l=[...u.children],n=k%(l.length+3);l.forEach((x,j)=>x.classList.toggle('done',j<n))});
 $$(el,'[data-hl]').forEach(t=>{const kids=$$(t,':scope>li>ul>li>.nd');kids.forEach((x,j)=>x.classList.toggle('hl',j===k%kids.length))});
 S[cur].live&&S[cur].live(el,k);
}
function go(i){
 i=Math.max(0,Math.min(N-1,i));if(i===cur)return;cur=i;t0=tk;
 sl.forEach((e,j)=>e.className=e.className.replace(/ ?(before|after|now)/g,'')+' '+(j<i?'before':j>i?'after':'now'));
 const s=S[i],P=s.p!=null?PART[s.p]:NEU;
 stage.style.setProperty('--c',P.c);stage.style.setProperty('--c2',P.c2);
 [...pg.children].forEach((b,j)=>b.className=j===i?'on':j<i?'done':'');
 [...tabs.children].forEach((b,j)=>b.classList.toggle('on',s.p===j));
 document.getElementById('home').style.visibility=tabs.style.visibility=(i===0||i===N-1)?'hidden':'visible';
 run();try{history.replaceState(null,'','#s'+(i+1))}catch(e){}
}
setInterval(()=>{if(cur>=0){tk++;run()}},850);
/* ---- navigation (no visible arrows) ---- */
addEventListener('keydown',e=>{const k=e.key;
 if(['ArrowRight','ArrowDown','PageDown',' ','Enter'].includes(k)){e.preventDefault();go(cur+1)}
 else if(['ArrowLeft','ArrowUp','PageUp','Backspace'].includes(k))go(cur-1);
 else if(k==='Home')go(0);else if(k==='End')go(N-1)});
addEventListener('click',e=>{if(e.target.closest('button'))return;go(cur+(e.clientX<innerWidth*.28?-1:1))});
let x0=null;addEventListener('touchstart',e=>x0=e.touches[0].clientX,{passive:true});
addEventListener('touchend',e=>{if(x0==null)return;const d=e.changedTouches[0].clientX-x0;x0=null;if(Math.abs(d)>60)go(cur+(d<0?1:-1))});
let wl=0;addEventListener('wheel',e=>{const n=Date.now();if(n-wl<800||Math.abs(e.deltaY)<20)return;wl=n;go(cur+(e.deltaY>0?1:-1))},{passive:true});
function fit(){stage.style.transform=`translate(-50%,-50%) scale(${Math.min(innerWidth/1920,innerHeight/1080)})`}
addEventListener('resize',fit);fit();
const m=/^#s(\d+)$/.exec(location.hash);go(m?+m[1]-1:0);
addEventListener('hashchange',()=>{const m=/^#s(\d+)$/.exec(location.hash);if(m)go(+m[1]-1)});
document.getElementById('home').onclick=()=>go(0);
</script>
</body>
</html>
